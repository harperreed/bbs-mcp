# GoReleaser configuration for bbs
# macOS binaries built by GoReleaser, Linux binaries built separately in CI
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bbs
    binary: bbs
    main: ./cmd/bbs
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - sqlite_omit_load_extension

archives:
  - id: bbs
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - docs/**/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Other'
      order: 999

homebrew_casks:
  - repository:
      owner: harperreed
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    ids:
      - bbs
    binaries:
      - bbs
    directory: Casks
    homepage: https://github.com/harperreed/bbs-mcp
    description: "A lightweight message board for humans and AI agents"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binary is not Developer ID signed or notarized, so Gatekeeper would block the
    # quarantined download. Stripping quarantine bypasses that check; drop this hook once
    # releases are signed and notarized.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bbs"]
          end
